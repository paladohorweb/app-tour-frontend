# Set the real backend URL before using this configuration.
[build]
  command = "npm run build:production"
  publish = "dist/turismo-app/browser"
[build.environment]
  NODE_VERSION = "20.20.2"
[[redirects]]
  from = "/api/*"
  to = "https://REEMPLAZAR-BACKEND.example/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
