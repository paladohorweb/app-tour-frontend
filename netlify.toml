# Juan te guia: standalone demo, no backend required.
[build]
  command = "npm run build:demo"
  publish = "dist/turismo-demo-v2/browser"
[build.environment]
  NODE_VERSION = "20.20.2"
  NPM_VERSION = "10.9.0"
  NG_CLI_ANALYTICS = "false"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
